name: Build NDS Game

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          echo "DEVKITPRO=$DEVKITPRO"
          echo "DEVKITARM=$DEVKITARM"
          arm-none-eabi-gcc --version
          make --version

      - name: Build NDS ROM
        run: make

      - name: Find build artifacts
        run: |
          find . -type f \( -name "*.nds" -o -name "*.gba" \) -print

      - name: Upload NDS ROM
        uses: actions/upload-artifact@v4
        with:
          name: nds-runner
          path: |
            **/*.nds
          if-no-files-found: error
