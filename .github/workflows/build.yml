name: Build NDS Game

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show devkitARM environment
        run: |
          echo "DEVKITPRO=$DEVKITPRO"
          echo "DEVKITARM=$DEVKITARM"
          echo "PATH=$PATH"
          ls -la "$DEVKITARM"
          ls -la "$DEVKITARM/bin" || true
          make --version

      - name: Build NDS ROM
        run: make

      - name: Find NDS ROM
        run: |
          find . -type f -name "*.nds" -print

      - name: Upload NDS ROM
        uses: actions/upload-artifact@v4
        with:
          name: nds-runner
          path: "**/*.nds"
          if-no-files-found: error
