name: Build NDS ROM

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ROM
        working-directory: nds-runner
        run: make

      - name: Upload .nds artifact
        uses: actions/upload-artifact@v4
        with:
          name: steel-vanguard-nds
          path: nds-runner/steel-vanguard.nds
          if-no-files-found: error
