name: Build Nintendo DS ROM

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkitarm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install NDS development libraries
        run: dkp-pacman -S --noconfirm nds-dev

      - name: Build .nds
        run: make

      - name: Upload .nds ROM
        uses: actions/upload-artifact@v4
        with:
          name: blockcraft-nds
          path: "*.nds"
